<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>処理エラー / Processing Error / 处理错误</title></head>
<body style="
font-family:Arial,sans-serif;
margin:0;
line-height:1.8;
background:radial-gradient(1200px 480px at 50% -180px,#e7f0ff 0%,rgba(231,240,255,0) 70%), #f5f8ff;
color:#10213f;
">

<div style="
max-width:1520px;
margin:40px auto;
padding:36px 40px;
background:white;
border-radius:4px;
border:1.5px dashed #b00020;
box-shadow:0 14px 40px rgba(8,40,90,.12);
">
  <div style="text-align:center; margin-bottom:8px;">
    <div style="width:64px; height:64px; margin:0 auto; border-radius:50%; border:2px solid #b00020; display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:30px; font-weight:700; color:#b00020;">!</div>
  </div>
  <h1 style="
font-family:Georgia,'Hiragino Mincho ProN','Yu Mincho','Songti SC','Noto Serif SC',serif;
font-size:30px;
padding-bottom:10px;
margin:8px auto 24px;
border-bottom:2px solid #b00020;
display:table;
color:#b00020;
text-align:center;
">処理エラー / Processing Error / 处理错误</h1>

  <div style="
border:2px solid #e0b4b4;
background:#fff5f5;
padding:22px 24px;
margin:20px 0 28px;
border-radius:12px;
font-size:17px;
">
    <p><strong>日本語：</strong>処理中にエラーが発生しました。</p>
    <p><strong>English：</strong>An error occurred during processing.</p>
    <p><strong>中文：</strong>处理过程中发生错误。</p>
  </div>

  <h2 style="font-family:Georgia,serif; color:#101f36; font-size:19px;">エラー内容 / Error / 错误内容</h2>
  <div style="white-space:pre-wrap; border:1px solid #c5d0e3; border-radius:10px; padding:16px; background:#ffffff; font-size:15.5px; line-height:1.8;">{{ message }}</div>

  <div style="display:flex; gap:14px; flex-wrap:wrap; margin-top:28px;">
    <a href="/?lang=ja" style="display:inline-block; padding:12px 22px; border-radius:8px; background:#101f36; color:#e6d3a0; font-weight:700; text-decoration:none;">トップへ戻る</a>
    <a href="/?lang=zh" style="display:inline-block; padding:12px 22px; border-radius:8px; background:#101f36; color:#e6d3a0; font-weight:700; text-decoration:none;">返回首页</a>
  </div>
</div>
</body>
</html>
